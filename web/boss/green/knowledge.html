<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>吴凌绿植 · 共享知识库</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#243148;font:15px/1.6 system-ui,"Microsoft YaHei"}header{background:#132338;color:white;padding:24px max(24px,calc((100vw - 1200px)/2));display:flex;align-items:center;justify-content:space-between}h1{font-size:24px;margin:0}header a{color:#d9e9ff}main{max-width:1200px;margin:24px auto;padding:0 20px}.muted{color:#63738b;font-size:13px}.bar,.stats,.card{background:white;border:1px solid #dfe6ef;border-radius:14px;padding:20px;margin:16px 0}.bar{display:flex;gap:12px;flex-wrap:wrap;align-items:center}button,select,input,textarea{font:inherit;border:1px solid #ccd6e3;border-radius:8px;padding:9px 12px;background:white}button{cursor:pointer;color:#234a82}button.primary{background:#2864d7;color:white;border-color:#2864d7}button.danger{color:#a12139}button:disabled{opacity:.5;cursor:default}input{flex:1;min-width:160px}textarea{width:100%;min-height:110px}label{display:block;margin:12px 0}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.row .grow{flex:1}.badge{background:#edf2fc;color:#2a56a1;padding:3px 10px;border-radius:7px;font-size:12px}.review{background:#fff1d7;color:#8b5700}.approved{background:#e1f5ec;color:#10734b}.rejected{background:#fbe7e8;color:#962b35}pre{white-space:pre-wrap;word-break:break-word;font:inherit;margin:8px 0}dialog{width:min(850px,94vw);max-height:90vh;border:0;border-radius:16px;padding:24px}dialog::backdrop{background:#13233888}#message{min-height:28px;color:#a12139}.pages{display:flex;justify-content:center;align-items:center;gap:16px}h3{margin:8px 0;font-size:16px}details{margin:12px 0}.stats span{margin-right:25px}small{color:#63738b}footer{padding:24px 0}#list:empty:after{content:'暂无符合条件的知识';display:block;text-align:center;padding:50px;color:#63738b}</style>
<header><div><h1>吴凌绿植 · 共享知识库</h1><div>自动学习 · 去重 · 冲突审核 · 跨电脑同步</div></div><a href="/">返回老板看板</a></header>
<main><p class="muted">本库仅属于吴凌绿植。不共享客户身份和订单；商品问答仅在当前商品证据匹配时使用。删除或暂停后在线客户端约 60 秒撤回；离线超过 10 分钟停止使用共享参考，本地商品数据不受影响。</p>
<div id="message" role="status"></div><div class="stats" id="stats"></div>
<div class="bar"><select id="state"><option value="">全部状态</option><option value="approved">已入库 / 自动下发</option><option value="review">待审核 / 有冲突</option><option value="rejected">已拒绝</option></select><input id="search" placeholder="搜索问题、回答、品种、参数"><input id="category" placeholder="分类筛选，例如：茶花 / 三折"><button id="query" class="primary">查询</button><button id="refresh">刷新</button></div>
<div id="list"></div><div class="pages"><button id="prev">上一页</button><span id="paging"></span><button id="next">下一页</button></div>
<details class="card"><summary>电脑同步情况</summary><div id="receipts"></div><p class="muted">显示客户端已接收的版本；新电脑登录同一后台后自动获取已批准知识，不需要复制旧电脑数据库。</p></details></main>
<dialog id="editor"><h2>编辑知识与适用条件</h2><p class="muted">修改保存后先待审核；确认发布后自动下发。商品证据需能在当前商品资料中逐字核对。客户订单、价格、赔付等不进入跨店库。</p><label>分类<input id="editCategory" style="width:100%"></label><label>适用颜色（逗号分隔，留空表示不限定）<input id="editColors" style="width:100%"></label><label>问题<textarea id="editQ"></textarea></label><label>回复参考<textarea id="editA"></textarea></label><label>商品证据（每行一项）<textarea id="editEvidence"></textarea></label><div class="row"><button id="save" class="primary">保存修改，待确认</button><button id="cancel">关闭</button><span id="editError"></span></div></dialog>
<script>
const TOKEN_KEY='wl_token',ROLE_KEY='wl_role';let page=1,pages=1,rows=[],current=null;
const $=id=>document.getElementById(id),names={approved:'已入库',review:'待审核',rejected:'已拒绝',deleted:'已删除'};
function el(tag,text,cls){const x=document.createElement(tag);x.textContent=text;if(cls)x.className=cls;return x}
async function call(body){const token=localStorage.getItem(TOKEN_KEY)||'';if(!token)throw Error('请先返回老板后台登录');const r=await fetch('/api/knowledge/admin',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify(body)});const d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'请求失败');return d}
async function load(){try{$('message').textContent='';const d=await call({action:'list',page,state:$('state').value,search:$('search').value,category:$('category').value});rows=d.rows;pages=d.pages;
 $('stats').replaceChildren(...['approved','review','rejected'].map(s=>el('span',names[s]+' '+(d.counts[s]||0))));$('list').replaceChildren();
 rows.forEach(r=>{const c=el('article','','card'),head=el('div','','row');head.append(el('strong',r.category,'grow'),el('span',names[r.state]||r.state,'badge '+r.state));c.append(head,el('h3',r.question),el('pre',r.answer),el('div',r.reason,'muted'));
 const det=el('details'),sum=el('summary','适用条件 / 证据');det.append(sum,el('pre','颜色：'+(r.colors.join('、')||'不限')+'\n证据：\n'+(r.evidence.join('\n')||'通用接待，无商品参数')+'\n版本：'+r.revision+' · '+r.actor));c.append(det);const ops=el('div','','row');
 for(const [op,text] of [['edit','编辑'],['approve','确认入库并下发'],['reject','停用 / 拒绝'],['delete','删除']]){if(op==='approve'&&r.state==='approved')continue;const b=el('button',text,op==='delete'?'danger':'');b.onclick=()=>op==='edit'?edit(r):action(r,op,b);ops.append(b)}c.append(ops);$('list').append(c)});
 $('paging').textContent=`第 ${page} / ${pages} 页 · ${d.total} 条`;$('prev').disabled=page<=1;$('next').disabled=page>=pages;$('receipts').replaceChildren(...d.receipts.map(r=>el('p',r.device+' · '+r.username+' · 版本 '+r.revision+' · '+new Date(r.seen*1000).toLocaleString())));
 }catch(e){$('message').textContent=e.message}}
function edit(r){current=r;$('editCategory').value=r.category;$('editColors').value=r.colors.join(',');$('editQ').value=r.question;$('editA').value=r.answer;$('editEvidence').value=r.evidence.join('\n');$('editError').textContent='';$('editor').showModal()}
async function action(r,op,b){if(op==='delete'&&!confirm('删除后将从所有电脑撤回，重复学习不会自动恢复。确定？'))return;b.disabled=true;try{await call({action:op,id:r.id,revision:r.revision});await load()}catch(e){$('message').textContent=e.message}finally{b.disabled=false}}
$('save').onclick=async()=>{try{await call({action:'save',id:current.id,revision:current.revision,item:{...current,category:$('editCategory').value.trim(),colors:$('editColors').value.split(/[,，、]/).map(x=>x.trim()).filter(Boolean),question:$('editQ').value,answer:$('editA').value,evidence:$('editEvidence').value.split('\n').map(x=>x.trim()).filter(Boolean)}});$('editor').close();await load()}catch(e){$('editError').textContent=e.message}};
$('cancel').onclick=()=>$('editor').close();$('query').onclick=()=>{page=1;load()};$('refresh').onclick=load;$('state').onchange=()=>{page=1;load()};$('search').onkeydown=e=>{if(e.key==='Enter'){page=1;load()}};$('prev').onclick=()=>{page--;load()};$('next').onclick=()=>{page++;load()};load();
</script><script>(function(){
const TOKEN='wl_token',DOMAIN='flower';
function mount(root){
 if(root.querySelector('#service-knowledge-box'))return;
 const box=document.createElement('section');box.id='service-knowledge-box';box.className='card';
 const heading=document.createElement('h2');heading.textContent='服务参考与待补充承诺';
 const status=document.createElement('p');const list=document.createElement('div');
 const refresh=document.createElement('button');refresh.textContent='刷新服务知识';
 const description=document.createElement('p');description.textContent='普通问答参考灵活表达；保修、赔付等由老板确认后发布。默认本版本全部店铺通用，绿植与雨伞分开；商品例外优先，无客户订单数据。编辑保存立即撤回旧版本，发布后自动下发。';
 const tools=document.createElement('div');[['warranty','保修范围/期限'],['compensation','赔付规则'],['gift','随单配件/赠品'],['resend','补发条件']].forEach(([topic,name])=>tools.append(button('设置通用'+name,()=>call({action:'create',topic}))));box.append(heading,description,tools,status,refresh,list);(root.querySelector('main')||root).prepend(box);
 async function call(b){const r=await fetch('/api/service-knowledge/admin',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+(localStorage.getItem(TOKEN)||'')},body:JSON.stringify({...b,domain:DOMAIN})});const d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'请求失败');return d;}
 function button(label,fn){const b=document.createElement('button');b.textContent=label;b.onclick=async()=>{b.disabled=true;try{await fn();await load();}catch(e){status.textContent=e.message;}finally{b.disabled=false;}};return b;}
 async function load(){try{const d=await call({action:'list'});const pending=d.rows.filter(r=>r.kind==='commitment'&&r.state==='draft').length;heading.textContent='服务参考与待补充承诺'+(pending?' · 待补充 '+pending+' 项':'');status.textContent='共 '+d.rows.length+' 条 · '+pending+' 项需老板确认';list.replaceChildren();
  d.rows.forEach(r=>{const card=document.createElement('details');card.className='card';const title=document.createElement('summary');title.textContent=r.title+' · '+(r.state==='published'?'已发布':'草稿')+' · '+(r.goods_id?'商品例外 · '+(r.goods_name||'商品名称待补充')+'（编号 '+r.goods_id+'）':'本版本全部店铺通用');card.append(title);
  const guide=document.createElement('textarea');guide.value=r.guidance||'';guide.placeholder='填写核实后的处理规则或承诺';guide.style.cssText='width:100%;min-height:85px';
  const variants=document.createElement('textarea');variants.value=(r.variants||[]).join('\n');variants.placeholder='可选表达，每行一条；不必机械照抄';variants.style.cssText='width:100%;min-height:70px';
  card.append(guide,variants,button('保存草稿',()=>call({action:'save',id:r.id,revision:r.revision,item:{guidance:guide.value,variants:variants.value.split('\n')}})),button('发布已保存内容',()=>call({action:'publish',id:r.id,revision:r.revision})),button('删除并撤回',async()=>{if(confirm('删除后从全部电脑撤回，确定？'))await call({action:'delete',id:r.id,revision:r.revision});}));list.append(card);});
 }catch(e){status.textContent=e.message;}}
 refresh.onclick=load;load();setInterval(()=>{if(box.isConnected&&!box.querySelector('details[open]'))load();},30000);
}
const old=window.mountSharedKnowledge;
if(old)window.mountSharedKnowledge=function(){old.apply(this,arguments);const host=document.querySelector('#viewKnowledge');if(host&&host.shadowRoot)mount(host.shadowRoot);else{for(const el of document.querySelectorAll('*'))if(el.shadowRoot){mount(el.shadowRoot);break;}}};
else if(location.pathname==='/knowledge')mount(document);
})();
</script></html>
