<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>吴凌绿植 · 转人工预警 / 售后处理</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:"PingFang SC","Microsoft YaHei",sans-serif; background:#07130d; color:#eaf7ef;
    -webkit-font-smoothing:antialiased; min-height:100vh; }
  .wrap { max-width:960px; margin:0 auto; padding:24px 20px 60px; }

  /* 登录 */
  .gate { position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(800px 500px at 80% 0%, rgba(239,68,68,.12), transparent 60%),#07130d; }
  .gbox { width:min(360px,90%); text-align:center; }
  .gbox .leaf { width:60px; height:60px; margin:0 auto 16px; border-radius:16px; display:grid; place-items:center;
    background:linear-gradient(140deg,#2ee37c,#0f9d5c); font-size:28px; }
  .gbox h1 { font-size:22px; letter-spacing:2px; margin-bottom:4px; }
  .gbox .sub { color:#8fd6af; font-size:12px; letter-spacing:2px; margin-bottom:22px; }
  .gbox input { width:100%; height:44px; margin-bottom:10px; border:1px solid #1f3a2c; border-radius:10px;
    background:#0c2016; color:#eaf7ef; font-size:14px; padding:0 14px; outline:none; }
  .gbox input:focus { border-color:#2ee37c; }
  .gbox button { width:100%; height:44px; border:0; border-radius:10px; background:linear-gradient(90deg,#2ee37c,#0f9d5c);
    color:#06231a; font-size:15px; font-weight:600; cursor:pointer; letter-spacing:2px; }
  .err { color:#ef4466; font-size:12px; margin-top:8px; min-height:16px; }

  /* 顶栏 */
  .head { display:flex; align-items:center; gap:12px; margin-bottom:18px; }
  .head h1 { font-size:20px; letter-spacing:1px; }
  .head .me { margin-left:auto; font-size:13px; color:#8fd6af; }
  .head button { padding:7px 14px; border:1px solid #2a4a38; border-radius:8px; background:transparent;
    color:#bfe9d1; cursor:pointer; font-size:12px; }

  /* 预警横幅 */
  .banner { display:none; align-items:center; gap:14px; padding:18px 20px; border-radius:14px; margin-bottom:18px;
    background:rgba(239,68,68,.14); border:1px solid rgba(239,68,68,.5); }
  .banner.on { display:flex; }
  .banner .pulse { width:16px; height:16px; border-radius:50%; background:#ef4466; flex:none;
    animation:blink 1s infinite; }
  @keyframes blink { 50% { opacity:.25; } }
  .banner .txt { font-size:16px; font-weight:600; color:#ffd7d7; }
  .banner .cnt { margin-left:auto; font-size:34px; font-weight:700; color:#ef4466; }

  /* 售后横幅 */
  .afsbanner { display:none; align-items:center; gap:14px; padding:18px 20px; border-radius:14px; margin-bottom:18px;
    background:rgba(245,192,106,.12); border:1px solid rgba(245,192,106,.45); }
  .afsbanner.on { display:flex; }
  .afsbanner .ico { font-size:24px; }
  .afsbanner .txt { font-size:16px; font-weight:600; color:#ffe6b8; }
  .afsbanner .sub { font-size:12px; color:#c9a86d; margin-top:3px; }
  .afsbanner .cnt { margin-left:auto; font-size:34px; font-weight:700; color:#f5c06a; }

  /* 板块标题 */
  .sect { display:flex; align-items:center; gap:10px; margin:26px 0 12px; }
  .sect h2 { font-size:15px; font-weight:600; letter-spacing:1px; color:#bfe9d1; }
  .sect .badge { font-size:12px; padding:2px 9px; border-radius:20px; background:#12301f; color:#7df0b0; }
  .sect .badge.warn { background:rgba(245,192,106,.16); color:#f5c06a; }

  /* 事件列表 */
  .empty { text-align:center; color:#5f8571; padding:40px 16px; font-size:14px; }
  .card { border:1px solid #1f3a2c; border-radius:14px; padding:18px 20px; margin-bottom:12px; background:#0c2016; }
  .card.alarm { border-color:rgba(239,68,68,.6); background:rgba(239,68,68,.06); }
  .card .top { display:flex; align-items:center; gap:10px; margin-bottom:10px; flex-wrap:wrap; }
  .card .site { font-size:15px; font-weight:600; color:#7df0b0; }
  .card .shop { font-size:13px; color:#bfe9d1; background:#12301f; padding:3px 10px; border-radius:8px; }
  .card .rule { margin-left:auto; font-size:12px; color:#f5c06a; border:1px solid rgba(245,192,106,.4);
    padding:2px 8px; border-radius:6px; }
  .card .q { font-size:15px; line-height:1.6; color:#eaf7ef; margin-bottom:12px; }
  .card .foot { display:flex; align-items:center; gap:10px; }
  .card .time { font-size:12px; color:#5f8571; }
  .card button { margin-left:auto; padding:8px 18px; border:0; border-radius:8px; background:linear-gradient(90deg,#2ee37c,#0f9d5c);
    color:#06231a; font-weight:600; cursor:pointer; font-size:13px; }
  .card button.done { background:#1f3a2c; color:#8fd6af; cursor:default; }

  /* 售后卡 */
  .afs { border:1px solid #2a4a38; border-radius:14px; margin-bottom:12px; background:#0c2016; overflow:hidden; }
  .afs.urgent { border-color:rgba(239,68,68,.55); box-shadow:0 0 0 1px rgba(239,68,68,.12) inset; }
  .afs .hd { display:flex; align-items:center; gap:10px; padding:14px 18px 10px; flex-wrap:wrap; }
  .afs .shop { font-size:14px; font-weight:600; color:#7df0b0; }
  .afs .tag { font-size:12px; padding:2px 8px; border-radius:6px; background:#12301f; color:#9fe0bb; }
  .afs .tag.warn { background:rgba(245,192,106,.16); color:#f5c06a; }
  .afs .tag.red { background:rgba(239,68,68,.18); color:#ff9f9f; }
  .afs .cd { margin-left:auto; font-size:13px; color:#8fd6af; font-variant-numeric:tabular-nums; }
  .afs .cd.hot { color:#ff8a8a; font-weight:600; }
  .afs .bd { display:flex; gap:14px; padding:0 18px 14px; }
  .afs .pic { width:66px; height:66px; border-radius:10px; object-fit:cover; background:#12301f; flex:none; }
  .afs .info { flex:1; min-width:0; }
  .afs .gname { font-size:14px; line-height:1.5; color:#eaf7ef; margin-bottom:4px;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .afs .meta { font-size:12px; color:#7fa891; line-height:1.7; }
  .afs .money { color:#ffb4b4; font-weight:600; }
  .afs .ft { display:flex; align-items:center; gap:8px; padding:12px 18px; border-top:1px solid #163024; flex-wrap:wrap; }
  .afs .ft button { border:0; border-radius:8px; padding:8px 16px; font-size:13px; font-weight:600;
    cursor:pointer; background:#1f3a2c; color:#bfe9d1; }
  .afs .ft button.ok { background:linear-gradient(90deg,#2ee37c,#0f9d5c); color:#06231a; }
  .afs .ft button.ghost { background:transparent; border:1px solid #2a4a38; color:#8fd6af; }
  .afs .ft .sp { margin-left:auto; }
  .afs .more { display:none; padding:0 18px 14px; font-size:12px; color:#9fb8a8; line-height:1.9; }
  .afs .more.on { display:block; }
  .afs .more b { color:#bfe9d1; font-weight:500; }
  .afs .res { font-size:12px; padding:2px 8px; border-radius:6px; background:#12301f; color:#8fd6af; }
  .afs .res.bad { background:rgba(239,68,68,.16); color:#ff9f9f; }

  /* 确认弹层 */
  .mask { display:none; position:fixed; inset:0; background:rgba(3,10,7,.72); z-index:50;
    align-items:center; justify-content:center; padding:20px; }
  .mask.on { display:flex; }
  .dlg { width:min(420px,100%); background:#0c2016; border:1px solid #2a4a38; border-radius:16px; padding:22px; }
  .dlg h3 { font-size:16px; margin-bottom:10px; }
  .dlg p { font-size:13px; color:#bfe9d1; line-height:1.8; margin-bottom:6px; }
  .dlg .row { display:flex; gap:10px; margin-top:18px; }
  .dlg .row button { flex:1; height:40px; border:0; border-radius:10px; font-size:14px; font-weight:600; cursor:pointer; }
  .dlg .row .c { background:#1f3a2c; color:#bfe9d1; }
  .dlg .row .y { background:linear-gradient(90deg,#2ee37c,#0f9d5c); color:#06231a; }
  .toast { position:fixed; left:50%; bottom:40px; transform:translateX(-50%); background:#12301f;
    border:1px solid #2a4a38; color:#bfe9d1; padding:12px 22px; border-radius:10px; font-size:13px;
    opacity:0; transition:.25s; pointer-events:none; z-index:60; }
  .toast.on { opacity:1; }
.afs-success-link{border:1px solid #3b7557;background:#1d4835;color:#d7f8e4;border-radius:8px;padding:6px 10px;font:inherit;cursor:pointer}
.afs-success-link:hover,.afs-success-link:focus-visible{background:#285c44;outline:1px solid #98d6b2}
.afs-success-link:disabled{opacity:.62;cursor:default}

/* yujing-ui-v3: compact, responsive workspace, no third-party assets */

.heading-sub{font-size:13px;color:var(--muted);margin-top:3px}.head .me{border:1px solid var(--line);border-radius:20px;padding:4px 12px}
.head button,.toolbar button,.pager button,.sound-panel button{border:1px solid #345548;border-radius:9px;background:#142d22;color:#d8eee2;padding:9px 14px;cursor:pointer;font:inherit}
button:hover{filter:brightness(1.12)}button:disabled{opacity:.4;cursor:default}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #8fe6b7;outline-offset:3px}
.sound-panel{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:#10251cbf;border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:22px}
.sound-panel label{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted)}.sound-panel input{width:116px;accent-color:#70d5a1}
#soundHint{font-size:12px;color:var(--muted);flex:1;min-width:210px}.sound-panel output{min-width:32px;font-variant-numeric:tabular-nums}
.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-bottom:24px}

.metric label{display:block;color:var(--muted);font-size:13px}.metric strong{display:block;font-size:32px;line-height:1.3;margin:7px 0 2px;font-variant-numeric:tabular-nums;color:#d9f7e6}.metric small{font-size:11px;color:#90ac9d}
.metric.attention strong{color:#f4c58c}.metric.action strong{color:#ffa5a5}
.metric.action{font:inherit;text-align:left;cursor:pointer;color:inherit;width:100%}.metric.action:hover{border-color:#89ba9f;background:#1c3b2d}.metric.action .metric-label{display:block;color:var(--muted);font-size:13px}.metric.action .metric-link{color:#a5ecc3}#alertGroup{scroll-margin-top:18px}#alertHeading:focus{outline:none}
.toolbar{padding:18px 20px;background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:20px}

.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}.field select,.field input{width:100%;border:1px solid #355247;border-radius:9px;background:#0b1d15;color:#e8f4ed;min-height:42px;padding:8px 12px;font:inherit}
.search-row{display:flex;gap:8px}.search-row input{min-width:0}.search-row button{white-space:nowrap;background:#237b53;border-color:#348f65;color:#f4fff7}
.toolbar-bottom{display:flex;gap:14px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--line);margin-top:16px;padding-top:12px;font-size:12px;color:var(--muted)}
#syncStatus{margin-left:auto;font-size:12px;color:#9bcdb1}.sync-error{color:#f2b783!important}
.sect{margin:26px 0 14px}.sect h2{font-size:18px;color:#e7f4ed}.sect .badge{font-size:12px}.section-note{margin-left:auto;font-size:12px;color:var(--muted)}
.banner,.afsbanner{padding:12px 18px;border-radius:12px;margin-bottom:14px}.banner .txt,.afsbanner .txt{font-size:14px}.banner .cnt,.afsbanner .cnt{font-size:23px}.afsbanner .sub{color:#c4b18d}.banner .pulse{width:9px;height:9px;animation:none}
#afsList{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}#afsList>.empty{grid-column:1/-1}
.afs{margin:0;border-color:var(--line);border-radius:14px;background:var(--surface);box-shadow:0 8px 24px #00000010}
.afs .hd{padding:16px 18px 12px;gap:7px}.afs .shop{color:#8ce3b4}.afs .tag{font-size:11px}.afs .bd{gap:12px;padding:0 18px 16px}.afs .pic{width:72px;height:72px;border-radius:10px}.afs .gname{font-size:14px;color:#e0eee5;line-height:1.65}.afs .meta{color:#a3bbaf;font-size:12px;line-height:1.85;overflow-wrap:anywhere}.afs .money{color:#ffb8a0;font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.afs .ft{background:#0c1f17;border-color:var(--line);padding:12px 18px}.afs .ft button{padding:7px 12px;font-weight:500}.afs .more{background:#0d2118;padding:14px 18px;border-top:1px solid var(--line);overflow-wrap:anywhere}.afs .more:not(.on){display:none}.afs .more b{color:#c0d7ca}.afs .evidence{padding:0 18px 12px!important}
.card.alarm{border-color:#704439;background:#2b2319}.card .q{font-size:14px}.card .time{color:#a7bbaf}.card .meta{color:#c6d5cb;font-size:13px}.card .foot{margin-top:12px}.empty{border:1px dashed #304d3e;background:#10251c80;border-radius:12px;padding:36px;color:#9ab9a7}
.pager{display:flex;gap:10px;align-items:center;justify-content:flex-end;flex-wrap:wrap;padding:16px 0;color:var(--muted);font-size:12px}.pager span{margin-right:auto}.pager select{background:#10251c;border:1px solid #345548;color:#d8eee2;padding:7px;border-radius:8px}.afs-success-link{font-size:12px;border-radius:20px;padding:4px 12px;margin:0!important}
.dlg{box-shadow:0 24px 80px #0008}.dlg p{overflow-wrap:anywhere}.toast{max-width:90vw}
.afsbanner.on{display:none}.head{margin-bottom:18px}.sound-panel{margin-bottom:16px}.metrics{margin-bottom:18px}.metric{padding:14px 20px}.toolbar{margin-bottom:14px}.alert-empty{display:none}
@media(min-width:1250px){#alertList{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}#alertList>.empty{grid-column:1/-1}.card{margin-bottom:0}}
@media(max-width:900px){.wrap{padding:22px 20px 40px}.filters{grid-template-columns:1fr 1fr}.field.search{grid-column:1/-1}#afsList{grid-template-columns:1fr}.head h1{font-size:23px}.section-note{display:none}}
@media(max-width:520px){.wrap{padding:18px 12px 32px}.metrics{gap:8px}.metric{padding:12px}.metric strong{font-size:26px}.metric small{display:none}.head .me{margin-left:0}.head .brand{width:100%}.toolbar{padding:14px}.filters{gap:10px;grid-template-columns:1fr}.field.search{grid-column:auto}.search-row{flex-wrap:wrap}.search-row input{flex:1;min-width:120px}#syncStatus{margin-left:0}.sound-panel{gap:10px}.afs .hd{padding:12px}.afs .bd{padding:0 12px 12px}.afs .pic{width:56px;height:56px}.afs .ft{padding:10px 12px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

</style>

<body>
  <div class="gate" id="gate">
    <div class="gbox">
      <div class="leaf">🌱</div>
      <h1>吴凌绿植 · 预警售后</h1>
      <div class="sub">人工客服 · 专盯自己负责的电脑</div>
      <input id="u" type="text" placeholder="账号" />
      <input id="p" type="password" placeholder="密码" />
      <button id="loginBtn">登 录</button>
      <div class="err" id="err"></div>
    </div>
  </div>

  <div class="wrap" id="main" style="display:none">
    <div class="head">
      <div class="brand"><div class="eyebrow">WULING · SERVICE DESK</div><h1>吴凌绿植 · 售后与预警工作台</h1><div class="heading-sub">按店铺有序处理，让每一笔售后都有着落</div></div>
      <span class="me" id="me"></span>

       <button id="logout">退出</button>
    </div>

    <div class="sound-panel">
      <button id="soundEnable" type="button">开启提醒音</button>
      <button id="soundMute" type="button">关闭提醒音</button>
      <label for="soundVolume">音量 <input id="soundVolume" type="range" min="0" max="100" step="5"><output id="volumeValue"></output></label>
      <button id="soundPreview" type="button">试听铃声</button><span id="soundHint" role="status"></span>

        <option value="return_refund">退货退款</option><option value="platform">平台已处理</option><option value="refund_success">退款成功</option><option value="done">已处理 / 历史</option>
      </select></div>

    </div><div class="toolbar-bottom"><span>店铺与查询作用于下方列表；状态仅筛选售后记录</span><span id="syncStatus" role="status">等待同步</span><button type="button" id="refreshList">刷新</button></div></div>

      <span class="pulse"></span>
      <span class="txt">有单转人工，请立即处理</span>
      <span class="cnt" id="cnt">0</span>
    </div>

    <div class="afsbanner" id="afsbanner">
      <span class="ico">📦</span>
      <div>
        <div class="txt" id="afsTip">有售后单等着处理</div>

      </div>

    <div id="alertGroup"><div class="sect"><h2 id="alertHeading" tabindex="-1">人工跟进</h2><span class="section-note">仅真正需要人工处理的会话 · 提醒音不受当前筛选影响</span></div>
    <div id="alertList"></div><div class="pager"><span id="alertPageInfo"></span><button id="alertPrev" type="button">上一页</button><button id="alertNext" type="button">下一页</button></div></div>

    <div class="sect">
      <h2>售后记录</h2>
      <span class="badge warn" id="afsBadge">0 单</span>
    </div>
    <button type="button" id="afsRefundSuccess" class="afs-success-link">退款成功 · 0 单</button><div style="height:14px"></div>
    <div id="afsList"></div><div class="pager"><span id="afsPageInfo"></span><label for="pageSize">每页</label><select id="pageSize"><option>10</option><option selected>20</option><option>50</option></select><button id="afsPrev" type="button">上一页</button><button id="afsNext" type="button">下一页</button></div>
  </div>

  <div class="mask" id="mask">
    <div class="dlg">
      <h3 id="dlgTitle">确认同意退款</h3>

      <div class="row">
        <button class="c" id="dlgCancel">取消</button>
        <button class="y" id="dlgOk">确认</button>
      </div>
    </div>
  </div>
  <div class="toast" id="toast"></div>

<script>

      ((!archived&&rule)?afsDetailLine('处理时限',rule):'')+

    document.getElementById('afsBadge').textContent=n+' 单';
    if(!n){
      box.innerHTML = '<div class="empty">'+(filter==='pending'&&successCount?'暂无待处理售后，可点上方「退款成功」查看已完成记录。':'当前筛选下没有售后记录')+'</div>';
      return;
    }
    box.innerHTML = items.map(function(it, i){
      var s = left(it);
      var hot = s>0 && s < 24*3600;   // 24 小时内要逾期的标红
      var hs = Number(it.handle_status);
      var locked = hs===1 || hs===2 || !!it.record_complete || it.refund_origin==='platform';
      if(locked) s=0;
      var resBadge = '';
      if(hs===1) resBadge = '<span class="res">已下指令，等电脑执行</span>';
      if(hs===2) resBadge='<span class="res">'+(refundSucceeded(it)?'退款已完成':'历史记录')+'</span>';
      if(it.refund_origin==='platform') resBadge='<span class="res">平台已处理</span>';
      if(hs===3) resBadge = '<span class="res bad">执行失败：'+esc(it.handle_msg||'')+'</span>';
      return '<div class="afs'+(hot?' urgent':'')+'" data-i="'+i+'">'+
        '<div class="hd">'+
          '<span class="shop">'+esc(it.shop_name||'')+'</span>'+
          '<span class="tag">'+esc(it.type_name||'售后')+'</span>'+
          '<span class="tag warn">'+esc(it.title||'')+'</span>'+
          (hot?'<span class="tag red">快超时</span>':'')+
          (s?'<span class="cd'+(hot?' hot':'')+'" data-cd="'+it.afs_id+'">剩 '+cdText(s)+'</span>':'')+
        '</div>'+
        '<div class="bd">'+
          (it.thumb?'<img class="pic" src="'+esc(it.thumb)+'" loading="lazy">':'')+
          '<div class="info">'+
            '<div class="gname">'+esc(it.goods_name||'')+'</div>'+
            '<div class="meta">'+
              (it.goods_spec?'规格：'+esc(it.goods_spec)+' × '+(it.goods_num||1)+'<br>':'')+
              '退款 <span class="money">'+yuan(it.refund)+'</span>'+
              (it.order_amount?' （订单 '+yuan(it.order_amount)+'）':'')+
              '<br>原因：'+esc(it.reason||'-')+' · 单号 '+esc(it.order_sn||'')+
              (it.reverse_tracking?'<br>退回快递：'+esc(it.reverse_tracking):'')+
            '</div>'+
          '</div>'+
        '</div>'+
        photos(it.images)+
        '<div class="more'+(openDetails.has(String(it.afs_id))?' on':'')+'" id="more-'+esc(it.afs_id)+'">'+
          '<b>售后编码：</b>'+esc(it.afs_id)+'<br>'+
          '<b>申请时间：</b>'+(it.created_at?tstr(it.created_at):'-')+'<br>'+
          afsDetailFacts(it)+
          (it.handle_msg?'<b>执行结果：</b>'+esc(it.handle_msg)+'<br>':'')+
          (hs===3?'<span style="color:#ff9f9f">电脑端执行失败，请到店铺后台手工处理，或让客户重新点击「同意退款」重试。</span>':'')+
        '</div>'+
        '<div class="ft">'+
          (locked?'':'<button class="ok" data-agree="'+esc(it.afs_id)+'">同意退款</button>'+
          '<button class="ghost" data-reject="'+esc(it.afs_id)+'">驳回</button>')+
          '<button class="ghost" data-more="'+esc(it.afs_id)+'">详情</button>'+
          '<span class="sp"></span>'+resBadge+
        '</div>'+
      '</div>';
    }).join('');

    box.querySelectorAll('[data-agree]').forEach(function(b){
      b.onclick = function(){ ask(b.dataset.agree, 'agree'); };
    });
    box.querySelectorAll('[data-reject]').forEach(function(b){
      b.onclick = function(){ ask(b.dataset.reject, 'reject'); };
    });
    box.querySelectorAll('[data-more]').forEach(function(b){
      b.onclick = function(){
        var el = document.getElementById('more-' + b.dataset.more);
        if(el){var id=String(b.dataset.more);if(openDetails.has(id))openDetails.delete(id);else openDetails.add(id);el.className='more'+(openDetails.has(id)?' on':'');}
      };
    });
  }

  // 每秒刷倒计时，不用重新请求
  setInterval(function(){
    document.querySelectorAll('[data-cd]').forEach(function(el){
      var id = el.dataset.cd;
      for(var i=0;i<AFS.length;i++){
        if(String(AFS[i].afs_id)===id){
          var s = left(AFS[i]);
          el.textContent = s ? ('剩 '+cdText(s)) : '已到处理时限';
          el.className = 'cd' + (s>0 && s<24*3600 ? ' hot' : '');
          break;
        }
      }
    });
  }, 1000);

  var pending = null;
  function ask(afsId, action){
    var it = null;
    for(var i=0;i<AFS.length;i++){ if(String(AFS[i].afs_id)===String(afsId)) { it=it||AFS[i]; } }
    if(!it || [1,2].indexOf(Number(it.handle_status))>=0 || it.record_complete || it.refund_origin==='platform') return;
    pending = {id: afsId, action: action};
    document.getElementById('dlgTitle').textContent = action==='agree' ? '确认同意退款' : '确认驳回退款';
    document.getElementById('dlgBody').innerHTML =
      '店铺：' + esc(it.shop_name||'') + '<br>' +
      '商品：' + esc(it.goods_name||'') + '<br>' +
      '退款金额：<span style="color:#ffb4b4;font-weight:600">' + yuan(it.refund) + '</span><br>' +
      (action==='agree'
        ? '确认后由这台店铺所在的电脑执行「同意退款」，钱会退回买家。'
        : '驳回需要填写理由，电脑端会打开发起驳回，可能还需要补一句说明。');
    document.getElementById('mask').className = 'mask on';
  }
  document.getElementById('dlgCancel').onclick = function(){
    document.getElementById('mask').className = 'mask';
    pending = null;
  };
  document.getElementById('dlgOk').onclick = async function(){
    if(!pending) return;
    var p = pending, actingToken=K, actingVersion=queryVersion;
    document.getElementById('mask').className = 'mask';
    pending = null;
    try {
      var r = await fetch(q('/api/aftersale/cmd'), {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({afs_id: p.id, action: p.action})
      });
      var j = await r.json();
      if(actingToken!==K||actingVersion!==queryVersion)return;
      toast(j.ok ? '已下发，电脑端马上执行（约 10 秒）' : ('下发失败：' + (j.error||'')));
      load(true);
    }catch(e){ toast('网络错误'); }
  };

  (function init(){
    if(K){ document.getElementById('me').textContent = NAME; showMain(); load(); }
    else showLogin();
  })();
  setInterval(function(){ if(K) load(); }, 5000);
})();
</script>
